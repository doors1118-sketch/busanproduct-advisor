# Include this snippet before the general `location /advisor-api/` proxy block.
# The vendor recommendation API remains active; only the retired law/contract
# chatbot, RAG, and QA endpoints are blocked.

location = /advisor-api/rag/status {
    default_type application/json;
    return 410 '{"detail":"retired legal/contract chatbot endpoint"}';
}

location ~ ^/advisor-api/(chat(?:/stream)?|qa-logs(?:/.*)?|qa-summary|qa-feedback)$ {
    default_type application/json;
    return 410 '{"detail":"retired legal/contract chatbot endpoint"}';
}

